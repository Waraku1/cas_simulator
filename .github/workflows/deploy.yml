name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cas-flight-simulator.heleshiheiheleshihei.workers.dev' }}
      C4D_RATED_PRODUCTION_GATE: ${{ vars.C4D_RATED_PRODUCTION_GATE || 'disabled' }}
      C4D_ACCOUNTS_DB_NAME: cas-simulator-accounts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate scaffold
        run: pnpm validate:scaffold

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm exec wrangler deploy

      - name: Verify production root
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PRODUCTION_URL/" > /dev/null

      - name: Verify health endpoint
        run: |
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PRODUCTION_URL/api/health")"
          echo "$HEALTH_JSON"
          HEALTH_JSON="$HEALTH_JSON" node -e 'const j = JSON.parse(process.env.HEALTH_JSON); if (j.ok !== true || j.stage !== "C0_FOUNDATION" || j.features?.multiplayer !== "C3_FOUNDATION") process.exit(1)'

      - name: Verify multiplayer WebSocket relay
        run: node scripts/verify-production-multiplayer.mjs

      - name: Verify C4D production rated product
        if: env.C4D_RATED_PRODUCTION_GATE == 'enabled'
        env:
          C4D_SMOKE_RUN_ID: ${{ github.run_id }}${{ github.run_attempt }}
        run: pnpm verify:production:c4d

      - name: Cleanup C4D production smoke accounts
        if: ${{ always() && env.C4D_RATED_PRODUCTION_GATE == 'enabled' && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          SEED="$(printf '%s' '${{ github.run_id }}${{ github.run_attempt }}' | tr -cd '[:alnum:]' | tail -c 10)"
          LOGIN_A="c4dpa_${SEED}"
          LOGIN_B="c4dpb_${SEED}"
          SQL="DELETE FROM rated_matches WHERE first_user_id IN (SELECT user_id FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B')) OR second_user_id IN (SELECT user_id FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B')); DELETE FROM sessions WHERE user_id IN (SELECT user_id FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B')); DELETE FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B');"
          pnpm exec wrangler d1 execute "$C4D_ACCOUNTS_DB_NAME" --remote --command "$SQL"
          echo "C4D_PRODUCTION_SMOKE_CLEANUP=PASS"
