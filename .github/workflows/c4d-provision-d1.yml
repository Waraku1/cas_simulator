name: C4D provision D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4d-d1-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: cas-simulator-accounts
      EVIDENCE_DIR: /tmp/c4d-provision-evidence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize provisioning evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "action=provision_d1"
            echo "git_sha=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "database_name=$DB_NAME"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVIDENCE_DIR/metadata.txt"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare API identity
        run: pnpm exec wrangler whoami

      - name: Verify D1 read authorization
        shell: bash
        run: |
          set -euo pipefail
          if ! pnpm exec wrangler d1 list --json > "$EVIDENCE_DIR/d1-list-before.json"; then
            echo "::error::Cloudflare API identity is valid, but D1 access is not authorized for this token/account. Update CLOUDFLARE_API_TOKEN with D1 access, then rerun this workflow."
            exit 1
          fi
          echo "C4D_D1_READ_AUTHORIZATION=PASS" | tee "$EVIDENCE_DIR/d1-read-authorization.txt"

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(cat "$EVIDENCE_DIR/d1-list-before.json")"
          DB_ID="$(LIST_JSON="$LIST_JSON" DB_NAME="$DB_NAME" node <<'NODE'
          const rows = JSON.parse(process.env.LIST_JSON || "[]");
          const row = Array.isArray(rows) ? rows.find((entry) => entry?.name === process.env.DB_NAME) : null;
          process.stdout.write(row?.uuid ?? row?.id ?? row?.database_id ?? "");
          NODE
          )"

          if [ -z "$DB_ID" ]; then
            echo "No existing D1 database named $DB_NAME; creating one."
            pnpm exec wrangler d1 create "$DB_NAME"
          else
            echo "Reusing existing D1 database named $DB_NAME."
          fi

          pnpm exec wrangler d1 list --json > "$EVIDENCE_DIR/d1-list-after.json"
          LIST_JSON="$(cat "$EVIDENCE_DIR/d1-list-after.json")"
          DB_ID="$(LIST_JSON="$LIST_JSON" DB_NAME="$DB_NAME" node <<'NODE'
          const rows = JSON.parse(process.env.LIST_JSON || "[]");
          const row = Array.isArray(rows) ? rows.find((entry) => entry?.name === process.env.DB_NAME) : null;
          process.stdout.write(row?.uuid ?? row?.id ?? row?.database_id ?? "");
          NODE
          )"

          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve D1 database ID after provisioning." >&2
            exit 1
          fi

          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "C4D_D1_DATABASE_ID=$DB_ID"

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote | tee "$EVIDENCE_DIR/migrations.txt"

      - name: Verify D1 schema
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(pnpm exec wrangler d1 execute "$DB_NAME" --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','sessions','rated_matches','d1_migrations') ORDER BY name;")"
          printf '%s\n' "$RESULT" | tee "$EVIDENCE_DIR/schema-after.json"
          RESULT="$RESULT" node <<'NODE' | tee "$EVIDENCE_DIR/schema-verification.txt"
          const payload = JSON.parse(process.env.RESULT || "[]");
          const rows = Array.isArray(payload)
            ? payload.flatMap((entry) => entry?.results ?? [])
            : (payload?.results ?? []);
          const names = new Set(rows.map((row) => row?.name));
          for (const required of ["users", "sessions", "rated_matches", "d1_migrations"]) {
            if (!names.has(required)) throw new Error(`Missing expected D1 table: ${required}`);
          }
          console.log("C4D_D1_SCHEMA=PASS");
          NODE

      - name: Provisioning summary
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          echo "C4D_D1_PROVISIONING=PASS"
          echo "C4D_D1_DATABASE_NAME=$DB_NAME"
          echo "C4D_D1_DATABASE_ID=$DB_ID"
          GIT_SHA="$GITHUB_SHA" GIT_REF="$GITHUB_REF" RUN_ID="$GITHUB_RUN_ID" RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" DB_NAME="$DB_NAME" DB_ID="$DB_ID" EVIDENCE_DIR="$EVIDENCE_DIR" node <<'NODE'
          const fs = require("node:fs");
          const value = {
            gate: "C4D_PRODUCTION_D1",
            status: "PASS",
            gitSha: process.env.GIT_SHA,
            gitRef: process.env.GIT_REF,
            githubRunId: process.env.RUN_ID,
            githubRunAttempt: process.env.RUN_ATTEMPT,
            databaseName: process.env.DB_NAME,
            databaseId: process.env.DB_ID,
            d1ReadAuthorization: "PASS",
            schema: "PASS",
            provisioning: "PASS",
          };
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/c4d-provision.json`, `${JSON.stringify(value, null, 2)}\n`);
          NODE
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_DIR/metadata.txt"
          echo "Next step: bind this real database_id as ACCOUNTS in wrangler.jsonc, then run the production deploy gate."

      - name: Upload C4D D1 provisioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4d-d1-provision-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/c4d-provision-evidence
          if-no-files-found: error
          retention-days: 30
