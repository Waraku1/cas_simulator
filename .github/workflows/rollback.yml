name: Rollback production

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Paste the exact full commit SHA of this rollback workflow ref
        required: true
        type: string
      target_version_id:
        description: Cloudflare Worker version ID to restore at 100 percent traffic
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm production traffic replacement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cas-flight-simulator.heleshiheiheleshihei.workers.dev' }}
      C4D_RATED_PRODUCTION_GATE: ${{ vars.C4D_RATED_PRODUCTION_GATE || 'disabled' }}
      C4D_ACCOUNTS_DB_NAME: cas-simulator-accounts
      EVIDENCE_DIR: /tmp/c5-rollback-evidence

    steps:
      - name: Checkout governance ref
        uses: actions/checkout@v4

      - name: Confirm rollback request
        shell: bash
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_SHA" != "$GITHUB_SHA" ]; then
            echo "Refusing rollback: confirm_sha does not match the selected workflow commit."
            echo "expected=$GITHUB_SHA"
            echo "received=$CONFIRM_SHA"
            exit 1
          fi
          if [ "$CONFIRMATION" != "ROLLBACK" ]; then
            echo "Refusing rollback: confirmation must be exactly ROLLBACK."
            exit 1
          fi
          if [ -z "$TARGET_VERSION_ID" ]; then
            echo "Refusing rollback: target_version_id is required."
            exit 1
          fi
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "action=rollback"
            echo "governance_git_sha=$GITHUB_SHA"
            echo "governance_git_ref=$GITHUB_REF"
            echo "target_version_id=$TARGET_VERSION_ID"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "production_url=$PRODUCTION_URL"
            echo "c4d_rated_production_gate=$C4D_RATED_PRODUCTION_GATE"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVIDENCE_DIR/metadata.txt"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture pre-rollback Cloudflare state
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments status --json > "$EVIDENCE_DIR/deployments-before.json"
          pnpm exec wrangler versions list --json > "$EVIDENCE_DIR/versions-before.json"

      - name: Reject no-op rollback target
        shell: bash
        env:
          C5C_VERSION_STATE_MODE: rollback-pre
          C5C_TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          C5C_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          C5C_DEPLOYMENTS_BEFORE_FILE: /tmp/c5-rollback-evidence/deployments-before.json
          C5C_VERSION_STATE_OUTPUT: /tmp/c5-rollback-evidence/c5c-rollback-preflight.json
        run: pnpm verify:c5c:version-state

      - name: Roll back to explicit Worker version
        id: rollback
        shell: bash
        env:
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          pnpm exec wrangler rollback "$TARGET_VERSION_ID" --yes \
            --message "C5 rollback target:${TARGET_VERSION_ID} governance-git:${GITHUB_SHA} run:${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

      - name: Verify rollback target is live
        shell: bash
        env:
          C5C_VERSION_STATE_MODE: rollback
          C5C_TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          C5C_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          C5C_DEPLOYMENTS_BEFORE_FILE: /tmp/c5-rollback-evidence/deployments-before.json
          C5C_DEPLOYMENTS_AFTER_FILE: /tmp/c5-rollback-evidence/deployments-live.json
          C5C_VERSION_STATE_OUTPUT: /tmp/c5-rollback-evidence/c5c-rollback-version-state.json
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments status --json > "$EVIDENCE_DIR/deployments-live.json"
          pnpm verify:c5c:version-state

      - name: Verify production root after rollback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -o /dev/null -w '%{http_code}\n' "$PRODUCTION_URL/" | tee "$EVIDENCE_DIR/root-http-status.txt"

      - name: Verify health endpoint after rollback
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PRODUCTION_URL/api/health")"
          printf '%s\n' "$HEALTH_JSON" | tee "$EVIDENCE_DIR/health-after.json"
          HEALTH_JSON="$HEALTH_JSON" node -e 'const j = JSON.parse(process.env.HEALTH_JSON); if (j.ok !== true || j.stage !== "C0_FOUNDATION" || j.features?.multiplayer !== "C3_FOUNDATION") process.exit(1)'

      - name: Verify multiplayer WebSocket relay after rollback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-multiplayer.mjs | tee "$EVIDENCE_DIR/multiplayer-smoke.txt"

      - name: Verify C4D production rated product after rollback
        if: env.C4D_RATED_PRODUCTION_GATE == 'enabled'
        env:
          C4D_SMOKE_RUN_ID: rb${{ github.run_id }}${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify:production:c4d | tee "$EVIDENCE_DIR/c4d-rated-smoke.txt"

      - name: Cleanup and verify C4D rollback smoke accounts
        if: ${{ always() && env.C4D_RATED_PRODUCTION_GATE == 'enabled' && steps.rollback.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          SEED="$(printf '%s' 'rb${{ github.run_id }}${{ github.run_attempt }}' | tr -cd '[:alnum:]' | tail -c 10)"
          LOGIN_A="c4dpa_${SEED}"
          LOGIN_B="c4dpb_${SEED}"

          LOOKUP_JSON="$(pnpm exec wrangler d1 execute "$C4D_ACCOUNTS_DB_NAME" --remote --json --command "SELECT user_id FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B') ORDER BY login_id;")"
          SQL_IDS="$(LOOKUP_JSON="$LOOKUP_JSON" node <<'NODE'
          const payload = JSON.parse(process.env.LOOKUP_JSON || "[]");
          const rows = Array.isArray(payload)
            ? payload.flatMap((entry) => entry?.results ?? [])
            : (payload?.results ?? []);
          const quote = (value) => `'${String(value).replaceAll("'", "''")}'`;
          const ids = rows.map((row) => row?.user_id).filter(Boolean);
          process.stdout.write(ids.length > 0 ? ids.map(quote).join(",") : "''");
          NODE
          )"

          SQL="DELETE FROM rated_matches WHERE first_user_id IN ($SQL_IDS) OR second_user_id IN ($SQL_IDS); DELETE FROM sessions WHERE user_id IN ($SQL_IDS); DELETE FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B');"
          pnpm exec wrangler d1 execute "$C4D_ACCOUNTS_DB_NAME" --remote --command "$SQL"

          VERIFY_SQL="SELECT (SELECT COUNT(*) FROM users WHERE login_id IN ('$LOGIN_A','$LOGIN_B')) AS users_remaining, (SELECT COUNT(*) FROM sessions WHERE user_id IN ($SQL_IDS)) AS sessions_remaining, (SELECT COUNT(*) FROM rated_matches WHERE first_user_id IN ($SQL_IDS) OR second_user_id IN ($SQL_IDS)) AS rated_matches_remaining;"
          VERIFY_JSON="$(pnpm exec wrangler d1 execute "$C4D_ACCOUNTS_DB_NAME" --remote --json --command "$VERIFY_SQL")"
          printf '%s\n' "$VERIFY_JSON" > "$EVIDENCE_DIR/c4d-cleanup-verification.json"
          VERIFY_JSON="$VERIFY_JSON" node <<'NODE'
          const payload = JSON.parse(process.env.VERIFY_JSON || "[]");
          const rows = Array.isArray(payload)
            ? payload.flatMap((entry) => entry?.results ?? [])
            : (payload?.results ?? []);
          const row = rows[0] ?? {};
          const counts = {
            users: Number(row.users_remaining),
            sessions: Number(row.sessions_remaining),
            ratedMatches: Number(row.rated_matches_remaining),
          };
          if (Object.values(counts).some((value) => !Number.isFinite(value) || value !== 0)) {
            console.error("C4D smoke cleanup verification failed", counts);
            process.exit(1);
          }
          console.log("C4D_SMOKE_CLEANUP_ZERO_COUNTS=PASS");
          NODE
          echo "C4D_ROLLBACK_SMOKE_CLEANUP=PASS" | tee "$EVIDENCE_DIR/c4d-cleanup.txt"

      - name: Capture post-rollback Cloudflare state
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          pnpm exec wrangler deployments status --json > "$EVIDENCE_DIR/deployments-after.json" 2> "$EVIDENCE_DIR/deployments-after.stderr.txt" || true
          pnpm exec wrangler versions list --json > "$EVIDENCE_DIR/versions-after.json" 2> "$EVIDENCE_DIR/versions-after.stderr.txt" || true
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_DIR/metadata.txt"

      - name: Upload C5 rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-production-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/c5-rollback-evidence
          if-no-files-found: error
          retention-days: 30
