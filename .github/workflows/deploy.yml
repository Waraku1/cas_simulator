name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cas-flight-simulator.heleshiheiheleshihei.workers.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate scaffold
        run: pnpm validate:scaffold

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy

      - name: Verify production root
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PRODUCTION_URL/" > /dev/null

      - name: Verify health endpoint
        run: |
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PRODUCTION_URL/api/health")"
          echo "$HEALTH_JSON"
          HEALTH_JSON="$HEALTH_JSON" node -e 'const j = JSON.parse(process.env.HEALTH_JSON); if (j.ok !== true || j.stage !== "C0_FOUNDATION") process.exit(1)'
