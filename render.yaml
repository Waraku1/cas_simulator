services:
  - type: web
    name: cas-simulator-school
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:render
    startCommand: pnpm start:render
    healthCheckPath: /gateway-health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: CAS_UPSTREAM_ORIGIN
        value: https://cas-flight-simulator.heleshiheiheleshihei.workers.dev
      - key: VITE_CESIUM_ION_TOKEN
        sync: false
