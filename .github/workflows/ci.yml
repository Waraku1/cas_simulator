name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate scaffold
        run: pnpm validate:scaffold

      - name: Type-check
        run: pnpm check

      - name: Verify C4C lifecycle contract
        run: pnpm verify:c4c:runtime

      - name: Verify C5A hardening contract
        run: pnpm verify:c5a

      - name: Verify C5B performance evidence contract
        run: pnpm verify:c5b

      - name: Verify C5C release governance contract
        run: pnpm verify:c5c

      - name: Verify C5E human QA contract
        run: pnpm verify:c5e

      - name: Verify C5F evidence package contract
        run: pnpm verify:c5f

      - name: Production build
        run: pnpm build

      - name: Verify school full-stack localhost mode
        run: |
          set -euo pipefail
          pnpm dev:school > /tmp/school-dev.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/api/health > /tmp/school-health.json; then
              READY=1
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat /tmp/school-dev.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/school-dev.log
            exit 1
          fi

          cat /tmp/school-health.json
          C5D_EVIDENCE_DIR=/tmp/c5d-school-regression pnpm verify:c5d:school

      - name: Upload C5D school regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5d-school-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/c5d-school-regression
            /tmp/school-health.json
            /tmp/school-dev.log
          if-no-files-found: warn
          retention-days: 30
